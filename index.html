<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pom Pom Blogs</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Home page specific styles */
        .hero-section {
            position: relative;
            padding: 70px 0 40px;
            text-align: center;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(108, 99, 255, 0.08), transparent 60%),
                        radial-gradient(circle at 70% 80%, rgba(168, 85, 247, 0.06), transparent 50%);
            z-index: 0;
            animation: heroGlow 20s ease-in-out infinite alternate;
        }

        @keyframes heroGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(2%, -2%) scale(1.1); }
        }

        .hero-section .container { position: relative; z-index: 1; }

        .hero-badge {
            display: inline-block;
            background: rgba(108, 99, 255, 0.12);
            border: 1px solid rgba(108, 99, 255, 0.2);
            padding: 6px 20px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #6c63ff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .hero-section h1 {
            font-size: clamp(2.6rem, 7vw, 4.6rem);
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -1.5px;
            margin-bottom: 14px;
        }

        .hero-section h1 .gradient-text {
            background: linear-gradient(135deg, #6c63ff, #a855f7, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-section p {
            color: #a0a0c0;
            font-size: 1.1rem;
            max-width: 540px;
            margin: 0 auto 28px;
            line-height: 1.7;
        }

        .search-container {
            max-width: 480px;
            margin: 0 auto 10px;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 50px;
            color: #f0f0ff;
            font-size: 1rem;
            transition: 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            outline: none;
            font-family: inherit;
            backdrop-filter: blur(10px);
        }

        .search-container input::placeholder { color: #6a6a8a; }

        .search-container input:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.25);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #6a6a8a;
            font-size: 1rem;
            pointer-events: none;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 48px;
            flex-wrap: wrap;
            padding: 16px 0 4px;
        }

        .stat-item { text-align: center; }

        .stat-number {
            display: block;
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #6a6a8a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .posts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 36px 0 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .posts-header h2 { font-size: 1.4rem; font-weight: 700; }

        .posts-header .post-count {
            color: #6a6a8a;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* Skeleton */
        .skeleton-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            overflow: hidden;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .skeleton-image {
            width: 100%;
            aspect-ratio: 16/10;
            background: rgba(255, 255, 255, 0.03);
        }

        .skeleton-body { padding: 22px 24px 24px; }

        .skeleton-line {
            height: 14px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .skeleton-line.short { width: 55%; }
        .skeleton-line.medium { width: 80%; }
        .skeleton-line.long { width: 95%; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @media (max-width: 768px) {
            .hero-section { padding: 50px 0 30px; }
            .stats-bar { gap: 24px; }
            .stat-number { font-size: 1.4rem; }
            .posts-header { flex-direction: column; align-items: flex-start; }
            .search-container input { padding: 12px 16px 12px 44px; font-size: 0.95rem; }
        }

        @media (max-width: 480px) {
            .hero-section h1 { font-size: 2rem; }
            .hero-section p { font-size: 1rem; }
            .stats-bar { gap: 16px; }
            .stat-number { font-size: 1.2rem; }
            .stat-label { font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="container">
            <a href="index.html" class="logo">✦ Pom Pom Blogs</a>
            <div class="nav-links">
                <a href="index.html" class="active">Home</a>
                <a href="admin.html">Admin</a>
            </div>
        </div>
    </nav>

    <section class="hero-section">
        <div class="container">
            <div class="hero-badge">✨ Latest Stories</div>
            <h1>Welcome to <span class="gradient-text">Pom Pom Blogs</span></h1>
            <p>Discover stories, ideas, and content from our community.</p>

            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search posts..." />
            </div>

            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-number" id="postCount">0</span>
                    <span class="stat-label">Posts</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="readingTime">0</span>
                    <span class="stat-label">Min Read</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number">✦</span>
                    <span class="stat-label">Premium</span>
                </div>
            </div>
        </div>
    </section>

    <main class="container">
        <div class="posts-header">
            <h2>📖 All Posts</h2>
            <span class="post-count" id="postCountLabel">0 posts</span>
        </div>
        <div id="posts-grid" class="grid"></div>
    </main>

    <footer>
        <div class="container">
            &copy; 2026 <a href="index.html">Pom Pom Blogs</a> · Built with ✨
        </div>
    </footer>

    <div class="toast-container" id="toastContainer"></div>

    <script type="module">
        // ============================================
        // SUPABASE CONFIG
        // ============================================
        const SUPABASE_URL = 'https://oofuqokpdvlomtnjvfvk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_nt4makZoISds9-x7ID1_0Q_xYIrBdK5';

        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const grid = document.getElementById('posts-grid');
        const searchInput = document.getElementById('searchInput');
        const postCountLabel = document.getElementById('postCountLabel');
        const postCount = document.getElementById('postCount');
        const readingTime = document.getElementById('readingTime');

        let allPosts = [];

        // ============================================
        // TOAST
        // ============================================
        function showToast(msg, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = msg;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ============================================
        // SKELETONS
        // ============================================
        function renderSkeletons(count = 6) {
            let html = '';
            for (let i = 0; i < count; i++) {
                html += `
                    <div class="skeleton-card">
                        <div class="skeleton-image"></div>
                        <div class="skeleton-body">
                            <div class="skeleton-line long"></div>
                            <div class="skeleton-line medium"></div>
                            <div class="skeleton-line short"></div>
                        </div>
                    </div>
                `;
            }
            grid.innerHTML = html;
        }

        // ============================================
        // RENDER POSTS
        // ============================================
        function renderPosts(posts) {
            if (!posts || posts.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📝</div>
                        <h3>No posts yet</h3>
                        <p>Check back later for fresh content.</p>
                    </div>
                `;
                postCountLabel.textContent = '0 posts';
                postCount.textContent = '0';
                readingTime.textContent = '0';
                return;
            }

            const fragment = document.createDocumentFragment();

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';

                const imageUrl = post.image_url || '';
                const title = post.caption || 'Untitled';
                const excerpt = post.description || '';
                const date = post.created_at ? new Date(post.created_at) : new Date();
                const dateStr = date.toLocaleDateString('en-US', {
                    month: 'short', day: 'numeric', year: 'numeric'
                });

                card.innerHTML = `
                    <div class="post-card-image-wrapper">
                        ${imageUrl
                            ? `<img src="${imageUrl}" alt="${title}" loading="lazy" onerror="this.parentElement.style.display='none'">`
                            : ''}
                    </div>
                    <div class="post-card-content">
                        <h3>${title}</h3>
                        <p>${excerpt}</p>
                        <small>📅 ${dateStr}</small>
                    </div>
                `;

                card.addEventListener('click', () => {
                    window.location.href = `post.html?id=${post.id}`;
                });

                fragment.appendChild(card);
            });

            grid.innerHTML = '';
            grid.appendChild(fragment);

            // Stats
            postCountLabel.textContent = `${posts.length} posts`;
            postCount.textContent = posts.length;

            const totalWords = posts.reduce((sum, p) => sum + (p.description || '').split(/\s+/).length, 0);
            readingTime.textContent = Math.max(1, Math.round(totalWords / 200));
        }

        // ============================================
        // SEARCH / FILTER
        // ============================================
        function filterPosts(query) {
            const q = query.toLowerCase().trim();
            if (!q) { renderPosts(allPosts); return; }

            const filtered = allPosts.filter(p =>
                (p.caption || '').toLowerCase().includes(q) ||
                (p.description || '').toLowerCase().includes(q)
            );
            renderPosts(filtered);
        }

        let searchTimeout = null;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => filterPosts(searchInput.value), 300);
        });

        // ============================================
        // LOAD POSTS
        // ============================================
        async function loadPosts() {
            renderSkeletons(6);
            try {
                const { data, error } = await supabase
                    .from('posts')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                allPosts = data || [];
                renderPosts(allPosts);
            } catch (err) {
                console.error('Error:', err);
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚠️</div>
                        <h3>Something went wrong</h3>
                        <p>${err.message}</p>
                    </div>
                `;
            }
        }

        // ============================================
        // KEYBOARD SHORTCUTS
        // ============================================
        document.addEventListener('keydown', (e) => {
            if ((e.key === '/' || (e.metaKey && e.key === 'k')) &&
                !e.target.closest('input, textarea, button')) {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            }
            if (e.key === 'Escape' && document.activeElement === searchInput) {
                searchInput.value = '';
                filterPosts('');
                searchInput.blur();
            }
        });

        // ============================================
        // INIT
        // ============================================
        loadPosts();
        console.log('✨ Pom Pom Blogs Home Loaded');
    </script>

</body>
</html>
